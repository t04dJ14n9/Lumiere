name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The real-VS Code specs (test/vscode, `pnpm test:vscode`) do not run here: they
# are flaky under load. They run locally before merging, see AGENTS.md.

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: pnpm check (format, lint, typecheck, unit tests, contributions)
        run: pnpm check
        env:
          # ESLint over the whole repository peaks near 3.7 GB. Node's default
          # heap on the 7 GB runners private repositories get is about 2 GB.
          NODE_OPTIONS: --max-old-space-size=4096

  # The extension ships to Windows too: its path handling and the unit tests'
  # runners are exercised there. Lint, format and typecheck do not depend on
  # the platform and run in `check`.
  check-windows:
    name: check (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Pinned fixtures and Prettier expect LF; Git for Windows checks out CRLF.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: pnpm test (unit tests)
        run: pnpm test

  # Both products' Chromium suites (`pnpm test:browser`), split over parallel
  # runners with Playwright's sharding: run one after the other they took
  # about 19 minutes on the 2-worker runners private repositories get.
  browser-shard:
    name: browser (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: markdown 1/3, package: markdown, args: --shard=1/3 }
          - { suite: markdown 2/3, package: markdown, args: --shard=2/3 }
          - { suite: markdown 3/3, package: markdown, args: --shard=3/3 }
          - {
              suite: pdf 1/2,
              package: pdf,
              args: --project=parallel --shard=1/2,
            }
          - {
              suite: pdf 2/2,
              package: pdf,
              args: --project=parallel --shard=2/2,
            }
          # The timing specs run one at a time on a runner of their own.
          - {
              suite: pdf timing,
              package: pdf,
              args: --project=timing --no-deps,
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - name: pnpm test:browser (${{ matrix.suite }})
        run: pnpm --filter "@workshop/${{ matrix.package }}" test:browser ${{ matrix.args }}
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results-${{ strategy.job-index }}
          path: |
            packages/${{ matrix.package }}/test-results/
            packages/${{ matrix.package }}/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # The merge gate and the release wait on this one job: it passes only when
  # every shard above passed.
  browser:
    name: browser
    needs: browser-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every browser shard passed
        run: test "${{ needs.browser-shard.result }}" = success

  # Scroll smoothness and opening speed (packages/markdown/test/quality): a
  # merge gate. Timing budgets stretch with the runner's measured speed.
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - name: pnpm test:quality
        run: pnpm test:quality
      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality
          path: packages/markdown/test-results/
          retention-days: 30
          if-no-files-found: ignore

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: pnpm package
        run: pnpm package
      - name: Committed files are unchanged by packaging
        run: git diff --exit-code
      - name: Check the VSIX size and file list
        run: bash .github/scripts/check-vsix.sh "$(ls *.vsix)" 20
      # Fails when the webview entry or the extension host grows over 10%;
      # warns for the other rows. `shell: bash` adds pipefail, so tee does
      # not hide the failure.
      - name: Bundle size report (job summary)
        shell: bash
        run: node scripts/bundle-size.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: "*.vsix"
          retention-days: 14
          if-no-files-found: error

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
      - name: Scan the full git history
        run: ./gitleaks git --redact --no-banner --verbose .

  audit:
    # Advisory only: reports known vulnerabilities in production dependencies
    # as a warning and never fails the build.
    name: audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - name: pnpm audit --prod
        run: |
          if pnpm audit --prod > audit.txt 2>&1; then
            cat audit.txt
          else
            cat audit.txt
            echo "::warning title=pnpm audit::$(tail -n 2 audit.txt | tr '\n' ' ')"
          fi
          { echo '### pnpm audit --prod'; echo '```'; tail -n 3 audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
