name: Release

# Push a tag such as v0.2.0 (matching package.json's version) to build the
# VSIX, publish it through Marketplace Trusted Publishing, and attach it to a
# GitHub Release. The tag's commit must be on main, and the release runs the
# merge gate's suites (AGENTS.md) on that commit before it publishes. The
# version's CHANGELOG.md heading picks the Marketplace channel:
# "## 0.1.22 (pre-release, 2026-11-22)" publishes a pre-release, and
# "## 0.1.23 (2026-11-22)" a release. A published version keeps its channel.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: tag
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      pre-release: ${{ steps.channel.outputs.pre-release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the tag's commit can be found on main.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - name: The tag matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      - name: The tag's commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main"
            exit 1
          fi
      - name: The changelog names the version and its channel
        id: channel
        run: |
          version=$(node -p 'require("./package.json").version')
          heading=$(grep -m1 -E "^## ${version//./\\.} \(" CHANGELOG.md || true)
          if [ -z "${heading}" ]; then
            echo "::error::CHANGELOG.md has no '## ${version} (…)' heading"
            exit 1
          fi
          case "${heading}" in
            *"(pre-release"*) pre_release=true ;;
            *) pre_release=false ;;
          esac
          echo "${heading} → pre-release: ${pre_release}"
          echo "pre-release=${pre_release}" >> "${GITHUB_OUTPUT}"

  # The same shards as CI's browser job (ci.yml), in parallel.
  browser-shard:
    name: browser (${{ matrix.suite }})
    needs: tag
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: markdown 1/3, package: markdown, args: --shard=1/3 }
          - { suite: markdown 2/3, package: markdown, args: --shard=2/3 }
          - { suite: markdown 3/3, package: markdown, args: --shard=3/3 }
          - {
              suite: pdf 1/2,
              package: pdf,
              args: --project=parallel --shard=1/2,
            }
          - {
              suite: pdf 2/2,
              package: pdf,
              args: --project=parallel --shard=2/2,
            }
          # The timing specs run one at a time on a runner of their own.
          - {
              suite: pdf timing,
              package: pdf,
              args: --project=timing --no-deps,
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - name: pnpm test:browser (${{ matrix.suite }})
        run: pnpm --filter "@workshop/${{ matrix.package }}" test:browser ${{ matrix.args }}

  # The merge gate and the release wait on this one job: it passes only when
  # every shard above passed.
  browser:
    name: browser
    needs: browser-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every browser shard passed
        run: test "${{ needs.browser-shard.result }}" = success

  quality:
    name: quality
    needs: tag
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - name: pnpm test:quality
        run: pnpm test:quality

  release:
    name: release
    needs: [tag, browser, quality]
    environment: vscode-marketplace
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: pnpm check
        run: pnpm check
      - name: Package for the channel
        env:
          PRE_RELEASE: ${{ needs.tag.outputs.pre-release }}
        run: |
          if [ "${PRE_RELEASE}" = "true" ]; then
            pnpm package:pre-release
          else
            pnpm package:release
          fi
      - name: The VSIX is marked for its channel
        env:
          PRE_RELEASE: ${{ needs.tag.outputs.pre-release }}
        run: |
          # vsce publish uploads the VSIX's manifest as it is: the channel is
          # the PreRelease property that vsce package wrote, not a publish flag.
          if unzip -p "$(ls *.vsix)" extension.vsixmanifest |
            grep -q 'Id="Microsoft.VisualStudio.Code.PreRelease" Value="true"'; then
            marked=true
          else
            marked=false
          fi
          if [ "${marked}" != "${PRE_RELEASE}" ]; then
            echo "::error::The VSIX's pre-release mark is ${marked}, the changelog asks for ${PRE_RELEASE}"
            exit 1
          fi
      - name: Check the VSIX size and file list
        run: bash .github/scripts/check-vsix.sh "$(ls *.vsix)" 20
      - name: Publish to Visual Studio Marketplace
        env:
          PRE_RELEASE: ${{ needs.tag.outputs.pre-release }}
        run: |
          channel=()
          if [ "${PRE_RELEASE}" = "true" ]; then
            channel=(--pre-release)
          fi
          pnpm exec vsce publish --oidc "${channel[@]}" --skip-duplicate \
            --packagePath "$(ls *.vsix)"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRE_RELEASE: ${{ needs.tag.outputs.pre-release }}
        run: |
          channel=()
          if [ "${PRE_RELEASE}" = "true" ]; then
            channel=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" *.vsix --title "${GITHUB_REF_NAME}" \
            --generate-notes --verify-tag "${channel[@]}"
