name: Set up Playwright's Chromium
description: >-
  Chromium for the installed Playwright version, cached across runs, with its
  system dependencies. Runs after ./.github/actions/setup.
runs:
  using: composite
  steps:
    - name: Read the Playwright version
      id: playwright
      shell: bash
      run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      id: browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
    - name: Install Chromium and its system dependencies
      if: steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
    - name: Install Chromium's system dependencies
      if: steps.browsers.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm exec playwright install-deps chromium
